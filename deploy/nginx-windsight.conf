# windsight.soniksarungale.com
#   Static frontend from /var/www/windsight, /api proxied to the pm2 "windsight" process.
#
#   sudo cp deploy/nginx-windsight.conf /etc/nginx/sites-available/windsight
#   sudo ln -sf /etc/nginx/sites-available/windsight /etc/nginx/sites-enabled/windsight
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d windsight.soniksarungale.com

server {
    listen 80;
    listen [::]:80;
    server_name windsight.soniksarungale.com;

    root /var/www/windsight;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
